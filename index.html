
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Tools</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #222;
}
header {
  background: #075985;
  color: white;
  text-align: center;
  padding: 25px 10px;
}
header h1 { margin: 0; }
.container {
  max-width: 650px;
  margin: 20px auto;
  padding: 12px;
}
.tool {
  background: white;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #ddd;
}
h2 { color: #075985; font-size: 20px; }
input, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #bbb;
  border-radius: 7px;
  font-size: 16px;
}
button {
  background: #0284c7;
  color: white;
  border: 0;
  padding: 12px 18px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 16px;
  margin-top: 8px;
}
button:hover { background: #0369a1; }
#qrcode { margin-top: 15px; }
footer {
  text-align: center;
  padding: 20px;
  color: #555;
}
</style>
</head>
<body>

<header>
<h1>Smart Tools</h1>
<p>Free Online Tools For Everyone</p>
</header>

<div class="container">

<div class="tool">
<h2>1. QR Code Generator</h2>
<input id="qrtext" placeholder="Enter link or text">
<button onclick="makeQR()">Generate QR Code</button>
<div id="qrcode"></div>
</div>

<div class="tool">
<h2>2. WhatsApp Direct Chat</h2>
<input id="phone" placeholder="Enter number with country code">
<button onclick="openWhatsApp()">Open WhatsApp Chat</button>
</div>

<div class="tool">
<h2>3. Text To Speech</h2>
<textarea id="speechtext" placeholder="Write your text here"></textarea>
<button onclick="speakText()">Speak Text</button>
<button onclick="stopSpeech()">Stop Voice</button>
</div>

<div class="tool">
<h2>4. Password Generator</h2>
<input id="password" placeholder="Your password will appear here" readonly>
<button onclick="generatePassword()">Generate Password</button>
<button onclick="copyPassword()">Copy Password</button>
</div>

</div>

<footer>
<p>© 2026 Smart Tools | All Rights Reserved</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
function makeQR() {
  let value = document.getElementById("qrtext").value.trim();
  if (!value) {
    alert("Please enter text or link");
    return;
  }
  let box = document.getElementById("qrcode");
  box.innerHTML = "";
  if (typeof QRCode === "undefined") {
    alert("QR library load nahi hui. Internet check karein.");
    return;
  }
  new QRCode(box, {
    text: value,
    width: 180,
    height: 180
  });
}

function openWhatsApp() {
  let number = document.getElementById("phone").value.replace(/\D/g, "");
  if (!number) {
    alert("Please enter WhatsApp number with country code");
    return;
  }
  window.open("https://wa.me/" + number, "_blank");
}

function speakText() {
  let text = document.getElementById("speechtext").value;
  if (!text.trim()) {
    alert("Please write something");
    return;
  }
  let speech = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(speech);
}

function stopSpeech() {
  speechSynthesis.cancel();
}

function generatePassword() {
  let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%";
  let pass = "";
  let random = new Uint32Array(14);
  crypto.getRandomValues(random);
  for (let i = 0; i < 14; i++) {
    pass += chars[random[i] % chars.length];
  }
  document.getElementById("password").value = pass;
}

function copyPassword() {
  let pass = document.getElementById("password").value;
  if (!pass) {
    alert("Generate password first");
    return;
  }
  navigator.clipboard.writeText(pass)
    .then(() => alert("Password copied"))
    .catch(() => alert("Please copy password manually"));
}
</script>

</body>
</html>
